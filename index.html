<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d20">
<title>NOVA Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#0e0b1b;--panel:#171329;--panel2:#201a38;--panel3:#292144;
 --purple:#9367ff;--purple2:#7046dc;--cyan:#35d9d0;
 --text:#f7f4ff;--muted:#a29ab8;--line:#ffffff12;
 --green:#39d6a3;--red:#ff6485;--yellow:#ffc66d;
 --radius:18px;--rail:76px;--list:350px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:var(--rail) var(--list) minmax(0,1fr);gap:10px;padding:10px}
.rail,.side,.main{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:0}
.rail{display:flex;align-items:center;flex-direction:column;padding:12px 7px;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:900;background:linear-gradient(145deg,#a27aff,#5430b3);box-shadow:0 8px 25px #7046dc55}
.nav{width:47px;height:47px;border:0;border-radius:15px;background:none;color:var(--muted);font-size:19px;position:relative}
.nav:hover,.nav.active{background:linear-gradient(135deg,#875bed,#5937b6);color:white}
.nav-bottom{margin-top:auto}
.side{display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:18px 17px 12px}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:26px;letter-spacing:1px;margin:0;font-weight:900;background:linear-gradient(90deg,#bda5ff,var(--cyan));color:transparent;background-clip:text}
.tag{font-size:10px;color:var(--muted)}
.icon{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:39px;height:39px;border-radius:12px}
.icon:hover{border-color:var(--purple)}
.search{display:flex;gap:10px;align-items:center;margin-top:15px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:0 12px;height:43px;color:var(--muted)}
.search input{background:none;border:0;outline:0;color:white;width:100%;font-size:12px}
.tabs{display:flex;gap:6px;padding:0 12px 12px;overflow:auto}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:none;color:var(--muted);border-radius:22px;padding:7px 12px;font-size:11px}
.tabs button.active{background:#7046dc33;border-color:#9367ff88;color:#d6c8ff}
.list{overflow:auto;flex:1;padding:4px 10px}
.label{font-size:11px;color:var(--muted);padding:8px;display:flex;justify-content:space-between}
.item{display:flex;gap:11px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.item:hover,.item.active{background:#ffffff0c}
.avatar{width:47px;height:47px;flex:0 0 47px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#7650ca,#3e2d70);font-size:17px;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:5px}
.name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview,.time{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{margin-top:4px}
.badge{background:var(--purple);border-radius:20px;padding:1px 7px;font-size:10px}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:35px 15px;line-height:2}
.main{display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{height:75px;flex:0 0 75px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px 17px;gap:12px}
.head-info{flex:1;min-width:0}
.head-info strong{font-size:14px;display:block}
.head-info small{font-size:10px;color:var(--green)}
.actions{display:flex;gap:7px}
.content{flex:1;overflow:auto;padding:20px;background:radial-gradient(ellipse at 50% 40%,#7046dc0c,transparent 65%)}
.welcome{height:100%;min-height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--muted)}
.welcome .logo{width:95px;height:95px;font-size:48px;border-radius:30px;margin-bottom:18px}
.welcome h2{color:white;margin:0 0 7px}
.welcome p{max-width:330px;font-size:12px;line-height:2}
.bubble-row{display:flex;margin:12px 0}
.bubble-row.mine{justify-content:flex-start}
.bubble-row.other{justify-content:flex-end}
.bubble{max-width:min(78%,520px);padding:10px 14px 7px;font-size:12px;line-height:1.9;border:1px solid var(--line);border-radius:17px;overflow-wrap:anywhere}
.mine .bubble{background:linear-gradient(135deg,#6742bf,#4d338e);border-bottom-left-radius:5px}
.other .bubble{background:var(--panel2);border-bottom-right-radius:5px}
.meta{font-size:9px;color:#c8b9ec;text-align:left;margin-top:3px}
.composer{display:flex;align-items:center;gap:9px;padding:12px;border-top:1px solid var(--line)}
.composer input{height:46px;min-width:0;flex:1;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:white;padding:0 14px}
.send{height:46px;width:47px;border:0;border-radius:14px;color:white;background:linear-gradient(135deg,var(--purple),var(--purple2))}
.composer-note{text-align:center;font-size:9px;color:var(--muted);padding-bottom:7px}
.screen{position:fixed;inset:0;background:#090713eF;z-index:20;display:none;place-items:center;padding:15px}
.dialog{width:min(480px,100%);max-height:90dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.dialog h2{font-size:19px;margin:0 0 14px}
.field{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:white;padding:0 12px;margin:6px 0}
textarea.field{height:95px;padding:10px;resize:vertical}
.primary,.secondary,.danger{height:43px;padding:0 16px;border-radius:12px;border:0;font-weight:700}
.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white}
.secondary{background:var(--panel3);border:1px solid var(--line);color:white}
.danger{background:#ff64851c;color:var(--red);border:1px solid #ff648544}
.full{width:100%;margin-top:9px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:var(--muted);font-size:11px}
.toast{position:fixed;z-index:60;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#30264e;border:1px solid var(--line);border-radius:12px;padding:11px 17px;font-size:12px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.profile-cover{height:110px;border-radius:15px;background:linear-gradient(120deg,#3d267b,#1b797b);margin-bottom:-40px}
.profile-avatar{width:88px;height:88px;border:4px solid var(--panel);border-radius:25px;position:relative;margin-right:15px;background:var(--panel2);overflow:hidden;display:grid;place-items:center;font-size:28px}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-body{padding:0 15px}
.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 5px;border-bottom:1px solid var(--line);font-size:12px}
.auth{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 20%,#38246e,#0e0b1b 65%);display:none;place-items:center;padding:18px}
.auth-card{width:min(420px,100%);background:#171329ed;border:1px solid var(--line);border-radius:25px;padding:28px;text-align:center}
.auth-card .logo{width:75px;height:75px;margin:0 auto 15px;font-size:38px}
.auth-card h2{margin:0}
.auth-card p{font-size:12px;color:var(--muted);line-height:2}
.auth-card .field{text-align:right}
.auth-error{color:var(--red);font-size:11px;min-height:20px;margin-top:7px}
.mobile-back{display:none}
@media(max-width:900px){:root{--list:300px}.optional{display:none}}
@media(max-width:650px){
 .app{display:block;padding:0}
 .rail{display:none}
 .side,.main{position:absolute;inset:0;border:0;border-radius:0}
 .main{display:none}
 .app.chat-open .side{display:none}
 .app.chat-open .main{display:flex}
 .header{height:65px;flex-basis:65px;padding:8px 10px}
 .content{padding:13px}
 .composer{padding:9px}
 .mobile-back{display:block}
}
</style>
</head>

<body>
<div class="app" id="app">
 <nav class="rail">
  <div class="logo">N</div>
  <button class="nav active" data-page="chats" title="المحادثات"><i class="fa-solid fa-comments"></i></button>
  <button class="nav" data-page="friends" title="الأصدقاء"><i class="fa-solid fa-user-group"></i></button>
  <button class="nav" data-page="groups" title="المجموعات"><i class="fa-solid fa-people-group"></i></button>
  <button class="nav" data-page="communities" title="المجتمعات"><i class="fa-solid fa-earth-africa"></i></button>
  <button class="nav" data-page="channels" title="القنوات"><i class="fa-solid fa-tower-broadcast"></i></button>
  <button class="nav" data-page="stories" title="الحالات"><i class="fa-solid fa-circle-play"></i></button>
  <div class="nav-bottom">
   <button class="nav" data-page="settings" title="الإعدادات"><i class="fa-solid fa-gear"></i></button>
   <button class="nav" data-page="profile" title="ملفي"><i class="fa-solid fa-user"></i></button>
  </div>
 </nav>

 <aside class="side">
  <div class="side-head">
   <div class="brand"><h1>NOVA</h1><button class="icon" id="newBtn"><i class="fa-solid fa-plus"></i></button></div>
   <div class="tag">تواصل بلا حدود ✦</div>
   <label class="search"><i class="fa fa-search"></i><input id="search" placeholder="ابحث..."></label>
  </div>
  <div class="tabs" id="tabs">
   <button class="active" data-filter="all">الكل</button>
   <button data-filter="unread">غير مقروء</button>
   <button data-filter="direct">شخصي</button>
   <button data-filter="group">مجموعات</button>
  </div>
  <div class="list">
   <div class="label"><span id="listTitle">المحادثات</span><span id="listCount">0</span></div>
   <div id="listArea" class="empty">جاري التحميل...</div>
  </div>
 </aside>

 <main class="main">
  <header class="header">
   <button class="icon mobile-back" id="back"><i class="fa fa-arrow-right"></i></button>
   <div class="avatar" id="headAvatar">N</div>
   <div class="head-info"><strong id="headName">NOVA Messenger</strong><small id="headStatus">مساحة تواصلك</small></div>
   <div class="actions">
    <button class="icon optional" id="searchInChat" title="بحث"><i class="fa fa-search"></i></button>
    <button class="icon optional" id="callBtn" title="مكالمة"><i class="fa fa-phone"></i></button>
    <button class="icon optional" id="videoBtn" title="فيديو"><i class="fa fa-video"></i></button>
    <button class="icon" id="chatMore" title="المزيد"><i class="fa fa-ellipsis-vertical"></i></button>
   </div>
  </header>
  <section class="content" id="content">
   <div class="welcome"><div class="logo">N</div><h2>أهلاً بك في NOVA</h2><p>مكانك للتواصل والمشاركة. اختر محادثة من القائمة أو ابدأ محادثة جديدة.</p></div>
  </section>
  <form class="composer" id="composer">
   <button class="icon" type="button" id="attachBtn" title="إرفاق"><i class="fa fa-paperclip"></i></button>
   <input id="message" placeholder="اكتب رسالة..." autocomplete="off" disabled>
   <button class="send" id="sendBtn" disabled><i class="fa fa-paper-plane"></i></button>
  </form>
  <div class="composer-note">NOVA Messenger · تواصل آمن</div>
 </main>
</div>

<!-- نافذة الدخول -->
<div class="auth" id="auth">
 <div class="auth-card">
  <div class="logo">N</div>
  <h2>مرحباً بك في NOVA</h2>
  <p>سجّل الدخول أو أنشئ حسابك للبدء.</p>
  <div id="authFields">
   <input class="field" id="authName" placeholder="اسم العرض (للحساب الجديد)" autocomplete="name">
   <input class="field" id="authEmail" type="email" placeholder="البريد الإلكتروني">
   <input class="field" id="authPassword" type="password" placeholder="كلمة المرور">
  </div>
  <button class="primary full" id="loginBtn">تسجيل الدخول</button>
  <button class="secondary full" id="signupBtn">إنشاء حساب جديد</button>
  <button class="secondary full" id="googleBtn"><i class="fa-brands fa-google"></i> المتابعة باستخدام Google</button>
  <div class="auth-error" id="authError"></div>
 </div>
</div>

<!-- نافذة عامة -->
<div class="screen" id="modal">
 <div class="dialog">
  <div class="row"><h2 id="modalTitle">NOVA</h2><button class="icon" id="closeModal" style="flex:0 0 40px"><i class="fa fa-xmark"></i></button></div>
  <div id="modalBody"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   NOVA MESSENGER — SINGLE FILE APP
   Supabase project: MEKA CHAT
   No service_role key is used in this browser application.
========================================================= */

const SUPABASE_URL = "https://rtlxnzyzlkezukyfgjbs.supabase.co";
const SUPABASE_KEY = "sb_publishable_qQJb_EzE3NgW74IxkwRDmw_0y4XIymI";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const state = {
 user:null, profile:null, conversations:[], current:null,
 messages:[], channel:null, filter:"all", page:"chats",
 people:[], pending:[], groups:[], stories:[], settings:null
};

function toast(message){
 const el=$("#toast");el.textContent=message;el.classList.add("show");
 setTimeout(()=>el.classList.remove("show"),2600);
}
function errorText(error){
 console.error(error);
 return error?.message || "حدث خطأ غير متوقع";
}
function safe(value=""){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function timeLabel(date){
 if(!date)return "";
 return new Date(date).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
}
function avatarHTML(profile,size=""){
 const letter=(profile?.display_name||profile?.username||"?").trim().charAt(0);
 return `<div class="avatar ${size}">${profile?.avatar_url?`<img src="${safe(profile.avatar_url)}">`:safe(letter)}</div>`;
}
function showAuth(message=""){
 $("#auth").style.display="grid";
 $("#authError").textContent=message;
}
function hideAuth(){ $("#auth").style.display="none"; }
function modal(title,html){
 $("#modalTitle").textContent=title;
 $("#modalBody").innerHTML=html;
 $("#modal").style.display="grid";
}
function closeModal(){ $("#modal").style.display="none"; }
$("#closeModal").onclick=closeModal;
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

async function run(promise){
 const {data,error}=await promise;
 if(error)throw error;
 return data;
}

/* ---------------- AUTH ---------------- */

async function signIn(){
 const email=$("#authEmail").value.trim();
 const password=$("#authPassword").value;
 if(!email||!password)throw Error("اكتب البريد الإلكتروني وكلمة المرور.");
 await run(db.auth.signInWithPassword({email,password}));
}
async function signUp(){
 const email=$("#authEmail").value.trim();
 const password=$("#authPassword").value;
 const display_name=$("#authName").value.trim()||email.split("@")[0];
 if(!email||password.length<6)throw Error("اكتب بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.");
 const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name}}});
 if(error)throw error;
 if(data.user && data.session){
  await ensureProfile(data.user,display_name);
 }else{
  toast("راجع بريدك لتأكيد الحساب، ثم سجّل الدخول.");
 }
}
async function googleSignIn(){
 const {error}=await db.auth.signInWithOAuth({
  provider:"google",
  options:{redirectTo:location.href.split("#")[0].split("?")[0]}
 });
 if(error)throw error;
}
async function logout(){
 await run(db.auth.signOut());
 state.user=null;state.profile=null;state.current=null;
 location.reload();
}
$("#loginBtn").onclick=async()=>{
 try{$("#authError").textContent="";await signIn()}
 catch(e){$("#authError").textContent=errorText(e)}
};
$("#signupBtn").onclick=async()=>{
 try{$("#authError").textContent="";await signUp()}
 catch(e){$("#authError").textContent=errorText(e)}
};
$("#googleBtn").onclick=async()=>{
 try{await googleSignIn()}catch(e){$("#authError").textContent=errorText(e)}
};

async function ensureProfile(user,displayName){
 const existing=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(existing.error)throw existing.error;
 if(existing.data){state.profile=existing.data;return existing.data}
 const row={
  id:user.id,
  display_name:displayName||user.email?.split("@")[0]||"عضو جديد",
  username:null,
  bio:"",
  account_type:"personal"
 };
 const created=await run(db.from("profiles").insert(row).select().single());
 state.profile=created;
 return created;
}
async function loadProfile(){
 let result=await db.from("profiles").select("*").eq("id",state.user.id).maybeSingle();
 if(result.error)throw result.error;
 if(!result.data){
  state.profile=await ensureProfile(state.user,state.user.user_metadata?.display_name);
 }else state.profile=result.data;
}

/* ---------------- BOOT ---------------- */

async function boot(){
 const {data,error}=await db.auth.getSession();
 if(error)throw error;
 if(!data.session){showAuth();return}
 state.user=data.session.user;
 await loadProfile();
 hideAuth();
 await loadSettings();
 await loadConversations();
 await loadRequests();
 updateIdentity();
}
db.auth.onAuthStateChange(async(event,session)=>{
 if(event==="SIGNED_OUT"){showAuth();return}
 if(session && !state.user){
  state.user=session.user;
  setTimeout(async()=>{
   try{
    await loadProfile();hideAuth();await loadSettings();
    await loadConversations();await loadRequests();updateIdentity();
   }catch(e){toast(errorText(e))}
  },0);
 }
});

/* ---------------- PROFILE ---------------- */

function updateIdentity(){
 const p=state.profile||{};
 $("#headName").textContent=p.display_name||"NOVA";
 $("#headStatus").textContent=p.nova_id||p.user_code||"حساب NOVA";
 $("#headAvatar").innerHTML=p.avatar_path
  ? `<img src="${safe(p.avatar_path)}">`
  : safe((p.display_name||"N").charAt(0));
}
async function uploadFile(file,folder){
 if(!file)throw Error("اختر ملفًا أولاً.");
 if(file.size>15*1024*1024)throw Error("الحد الأقصى للملف 15 ميجابايت.");
 const ext=file.name.split(".").pop().replace(/[^a-z0-9]/gi,"").toLowerCase()||"bin";
 const path=`${state.user.id}/${folder}/${crypto.randomUUID()}.${ext}`;
 const bucket="nova-media";
 const {data,error}=await db.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
 if(error)throw error;
 const {data:publicData}=db.storage.from(bucket).getPublicUrl(data.path);
 return {path:data.path,url:publicData.publicUrl};
}
async function saveProfile(form){
 const display_name=form.get("display_name")?.trim();
 const username=form.get("username")?.trim().replace(/^@/,"").toLowerCase()||null;
 const bio=form.get("bio")?.trim()||"";
 if(!display_name)throw Error("اسم العرض مطلوب.");
 const update={display_name,username,bio,updated_at:new Date().toISOString()};
 const avatar=$("#profileAvatarFile").files[0];
 const cover=$("#profileCoverFile").files[0];
 if(avatar){const up=await uploadFile(avatar,"avatars");update.avatar_path=up.url}
 if(cover){const up=await uploadFile(cover,"covers");update.cover_path=up.url}
 const saved=await run(db.from("profiles").update(update).eq("id",state.user.id).select().single());
 state.profile=saved;updateIdentity();toast("تم حفظ الملف الشخصي.");
}

/* ---------------- CONVERSATIONS ---------------- */

async function loadConversations(){
 const memberships=await run(
  db.from("conversation_members")
   .select("conversation_id,member_role,archived_at")
   .eq("user_id",state.user.id)
   .is("archived_at",null)
 );
 if(!memberships.length){
  state.conversations=[];renderList();return;
 }
 const ids=memberships.map(x=>x.conversation_id);
 const convs=await run(db.from("conversations").select("*").in("id",ids).order("last_message_at",{ascending:false,nullsFirst:false}));
 const members=await run(db.from("conversation_members").select("conversation_id,user_id").in("conversation_id",ids));
 const otherIds=[...new Set(members.map(m=>m.user_id).filter(id=>id!==state.user.id))];
 let profiles=[];
 if(otherIds.length)profiles=await run(db.from("profiles").select("id,display_name,username,avatar_path,nova_id").in("id",otherIds));
 const latest=await run(db.from("messages").select("conversation_id,body,message_type,created_at,sender_id").in("conversation_id",ids).order("created_at",{ascending:false}).limit(200));
 state.conversations=convs.map(c=>{
  const participantIds=members.filter(m=>m.conversation_id===c.id).map(m=>m.user_id);
  const other=profiles.find(p=>participantIds.includes(p.id));
  const msg=latest.find(m=>m.conversation_id===c.id);
  return {...c,other,title:c.title||(other?.display_name||"محادثة"),last:msg?.body||"",lastAt:msg?.created_at};
 });
 renderList();
}
function renderList(){
 const area=$("#listArea");area.innerHTML="";
 let rows=state.conversations;
 const q=$("#search").value.trim().toLowerCase();
 if(q)rows=rows.filter(c=>(c.title||"").toLowerCase().includes(q)||(c.last||"").toLowerCase().includes(q));
 if(state.filter==="direct")rows=rows.filter(c=>c.conversation_type==="direct");
 if(state.filter==="group")rows=rows.filter(c=>c.conversation_type!=="direct");
 $("#listCount").textContent=rows.length;
 if(!rows.length){area.className="empty";area.textContent="لا توجد محادثات هنا حتى الآن.";return}
 area.className="";
 rows.forEach(c=>{
  const el=document.createElement("div");
  el.className="item"+(state.current?.id===c.id?" active":"");
  const av=c.other?.avatar_path?`<div class="avatar"><img src="${safe(c.other.avatar_path)}"></div>`:`<div class="avatar">${safe((c.title||"N").charAt(0))}</div>`;
  el.innerHTML=`${av}<div class="info"><div class="top"><span class="name">${safe(c.title)}</span><span class="time">${timeLabel(c.lastAt)}</span></div><div class="preview">${safe(c.last||"ابدأ المحادثة")}</div></div>`;
  el.onclick=()=>openConversation(c);
  area.appendChild(el);
 });
}
$("#search").addEventListener("input",renderList);
$("#tabs").addEventListener("click",e=>{
 const b=e.target.closest("button[data-filter]");if(!b)return;
 $$("#tabs button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");state.filter=b.dataset.filter;renderList();
});

async function openConversation(conversation){
 state.current=conversation;
 $("#app").classList.add("chat-open");
 $("#headName").textContent=conversation.title;
 $("#headStatus").textContent=conversation.other?.nova_id||"محادثة NOVA";
 $("#headAvatar").textContent=(conversation.title||"N").charAt(0);
 $("#message").disabled=false;$("#sendBtn").disabled=false;
 await loadMessages();
 subscribeConversation(conversation.id);
 renderList();
}
async function loadMessages(){
 if(!state.current)return;
 const data=await run(db.from("messages").select("*")
  .eq("conversation_id",state.current.id)
  .order("created_at",{ascending:true}).limit(150));
 state.messages=data;renderMessages();
}
function renderMessages(){
 const area=$("#content");area.innerHTML="";
 if(!state.messages.length){
  area.innerHTML='<div class="welcome"><div class="logo">N</div><h2>ابدأ المحادثة</h2><p>أرسل أول رسالة بينك وبين هذا الحساب.</p></div>';
  return;
 }
 state.messages.forEach(m=>{
  const row=document.createElement("div");
  row.className="bubble-row "+(m.sender_id===state.user.id?"mine":"other");
  const body=m.is_deleted?"تم حذف الرسالة":m.body||"";
  row.innerHTML=`<div class="bubble">${safe(body)}<div class="meta">${timeLabel(m.created_at)}${m.is_edited?" · تم التعديل":""}</div></div>`;
  area.appendChild(row);
 });
 area.scrollTop=area.scrollHeight;
}
function unsubscribeConversation(){
 if(state.channel){db.removeChannel(state.channel);state.channel=null}
}
function subscribeConversation(id){
 unsubscribeConversation();
 state.channel=db.channel("nova-chat-"+id)
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${id}`},payload=>{
  if(!state.messages.some(m=>m.id===payload.new.id)){
   state.messages.push(payload.new);renderMessages();
  }
 })
 .subscribe();
}
async function sendMessage(body){
 if(!state.current)throw Error("افتح محادثة أولاً.");
 const text=body.trim();if(!text)return;
 await run(db.from("messages").insert({
  conversation_id:state.current.id,
  sender_id:state.user.id,
  message_type:"text",
  body:text
 }));
 await db.from("conversations").update({last_message_at:new Date().toISOString()}).eq("id",state.current.id);
 $("#message").value="";
}
$("#composer").addEventListener("submit",async e=>{
 e.preventDefault();
 try{await sendMessage($("#message").value)}
 catch(err){toast(errorText(err))}
});

/* إنشاء محادثة مباشرة مع مستخدم */
async function startDirect(profile){
 if(profile.id===state.user.id)throw Error("لا يمكنك بدء محادثة مع نفسك.");
 const existing=await run(db.from("conversation_members")
  .select("conversation_id").eq("user_id",state.user.id));
 const ids=existing.map(x=>x.conversation_id);
 if(ids.length){
  const matches=await run(db.from("conversation_members")
   .select("conversation_id,user_id").in("conversation_id",ids).eq("user_id",profile.id));
  const match=matches.find(x=>ids.includes(x.conversation_id));
  if(match){
   const c=state.conversations.find(x=>x.id===match.conversation_id);
   if(c){await openConversation(c);return}
  }
 }
 const conv=await run(db.from("conversations").insert({
  conversation_type:"direct",created_by:state.user.id
 }).select().single());
 await run(db.from("conversation_members").insert([
  {conversation_id:conv.id,user_id:state.user.id,member_role:"member"},
  {conversation_id:conv.id,user_id:profile.id,member_role:"member"}
 ]));
 await loadConversations();
 const created=state.conversations.find(x=>x.id===conv.id);
 if(created)await openConversation(created);
}

/* ---------------- FRIENDS ---------------- */

async function loadRequests(){
 const rows=await run(db.from("friendships").select("*")
  .eq("addressee_id",state.user.id).eq("status","pending"));
 state.pending=rows;
}
async function searchPeople(term){
 const clean=term.trim().replace(/^@/,"");
 if(clean.length<2)throw Error("اكتب حرفين على الأقل للبحث.");
 const {data,error}=await db.from("profiles").select("id,display_name,username,nova_id,avatar_path,bio")
  .or(`username.ilike.%${clean}%,display_name.ilike.%${clean}%,nova_id.ilike.%${clean}%`)
  .neq("id",state.user.id).limit(30);
 if(error)throw error;
 state.people=data||[];return state.people;
}
async function sendFriendRequest(id){
 await run(db.from("friendships").insert({requester_id:state.user.id,addressee_id:id,status:"pending"}));
 toast("تم إرسال طلب الصداقة.");
}
async function acceptFriend(id){
 await run(db.from("friendships").update({status:"accepted"}).eq("id",id).eq("addressee_id",state.user.id));
 await loadRequests();toast("تم قبول طلب الصداقة.");
}
async function showFriends(){
 const rows=await run(db.from("friendships").select("*")
  .or(`requester_id.eq.${state.user.id},addressee_id.eq.${state.user.id}`)
  .eq("status","accepted"));
 const ids=[...new Set(rows.map(x=>x.requester_id===state.user.id?x.addressee_id:x.requester_id))];
 const people=ids.length?await run(db.from("profiles").select("*").in("id",ids)):[];
 showPage("friends",people.map(p=>({id:p.id,title:p.display_name,sub:p.nova_id,action:`<button class="primary" data-chat="${p.id}">مراسلة</button>`})));
}

/* ---------------- GROUPS ---------------- */

async function loadGroups(){
 const memberships=await run(db.from("group_members").select("group_id").eq("user_id",state.user.id));
 if(!memberships.length){state.groups=[];return []}
 const ids=memberships.map(x=>x.group_id);
 state.groups=await run(db.from("groups").select("*").in("id",ids).order("created_at",{ascending:false}));
 return state.groups;
}
async function createGroup(name,description,isPrivate){
 const group=await run(db.from("groups").insert({
  name,description,created_by:state.user.id,is_private:isPrivate
 }).select().single());
 await run(db.from("group_members").insert({
  group_id:group.id,user_id:state.user.id,member_role:"owner"
 }));
 toast("تم إنشاء المجموعة.");
 await loadGroups();return group;
}

/* ---------------- STORIES ---------------- */

async function loadStories(){
 const rows=await run(db.from("stories").select("id,author_id,body,storage_path,background,visibility,expires_at,created_at")
  .gt("expires_at",new Date().toISOString()).order("created_at",{ascending:false}).limit(100));
 state.stories=rows;
 return rows;
}
async function createStory(body,file){
 let storage_path=null;
 if(file){const up=await uploadFile(file,"stories");storage_path=up.path}
 await run(db.from("stories").insert({
  author_id:state.user.id,body:body||"",storage_path,
  visibility:"friends",
  expires_at:new Date(Date.now()+86400000).toISOString()
 }));
 toast("تم نشر الحالة لمدة 24 ساعة.");
}

/* ---------------- COMMUNITIES / CHANNELS ---------------- */

async function loadPublicTable(table,fields="*"){
 return await run(db.from(table).select(fields).eq("is_public",true).order("created_at",{ascending:false}).limit(100));
}
async function createChannel(title,description,isPublic){
 return await run(db.from("channels").insert({
  owner_id:state.user.id,title,description,is_public:isPublic
 }).select().single());
}
async function createCommunity(name,description,isPublic){
 return await run(db.from("communities").insert({
  owner_id:state.user.id,name,description,is_public:isPublic
 }).select().single());
}

/* ---------------- SETTINGS ---------------- */

async function loadSettings(){
 const result=await db.from("user_settings").select("*").eq("user_id",state.user.id).maybeSingle();
 if(result.error)throw result.error;
 state.settings=result.data||{language:"ar",theme:"dark",settings:{},privacy:{},notification_preferences:{}};
}
async function saveSettings(patch){
 const payload={
  user_id:state.user.id,
  language:patch.language||state.settings.language||"ar",
  theme:patch.theme||state.settings.theme||"dark",
  settings:patch.settings||state.settings.settings||{},
  privacy:patch.privacy||state.settings.privacy||{},
  notification_preferences:patch.notification_preferences||state.settings.notification_preferences||{},
  updated_at:new Date().toISOString()
 };
 const saved=await run(db.from("user_settings").upsert(payload,{onConflict:"user_id"}).select().single());
 state.settings=saved;toast("تم حفظ الإعدادات.");
}

/* ---------------- PAGE RENDERING ---------------- */

function showPage(page,rows=[]){
 state.page=page;
 $("#app").classList.remove("chat-open");
 $("#listTitle").textContent=({
  chats:"المحادثات",friends:"الأصدقاء",groups:"المجموعات",
  communities:"المجتمعات",channels:"القنوات",stories:"الحالات",
  profile:"ملفي الشخصي",settings:"الإعدادات"
 })[page]||page;
 $("#tabs").style.display=page==="chats"?"flex":"none";
 $("#listArea").className="";
 $("#listArea").innerHTML="";
 $$(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(page==="chats"){renderList();return}
 if(page==="profile"){renderProfile();return}
 if(page==="settings"){renderSettings();return}
 if(page==="friends"){renderFriendPage(rows);return}
 if(page==="groups"){renderGroupPage();return}
 if(page==="stories"){renderStoryPage();return}
 if(page==="channels"){renderChannelPage();return}
 if(page==="communities"){renderCommunityPage();return}
}
function renderFriendPage(rows){
 const area=$("#listArea");
 const search=document.createElement("button");search.className="primary full";search.textContent="البحث عن أشخاص";
 search.onclick=()=>modal("البحث عن أصدقاء",`
  <input class="field" id="peopleQuery" placeholder="اسم المستخدم أو NOVA ID">
  <button class="primary full" id="peopleSearchBtn">بحث</button>
  <div id="peopleResults"></div>`);
 area.appendChild(search);
 const requests=document.createElement("button");requests.className="secondary full";requests.textContent=`طلبات الصداقة (${state.pending.length})`;
 requests.onclick=()=>modal("طلبات الصداقة",state.pending.map(r=>`
  <div class="setting"><span>طلب صداقة</span><button class="primary" data-accept="${r.id}">قبول</button></div>`).join("")||'<p class="muted">لا توجد طلبات.</p>');
 area.appendChild(requests);
 rows.forEach(p=>addListRow(area,p.title,p.sub,p.action));
}
function addListRow(area,title,sub,action=""){
 const el=document.createElement("div");el.className="item";
 el.innerHTML=`<div class="avatar">${safe((title||"?").charAt(0))}</div><div class="info"><div class="name">${safe(title)}</div><div class="preview">${safe(sub||"")}</div></div>${action}`;
 area.appendChild(el);
}
async function renderGroupPage(){
 $("#listArea").innerHTML='<button class="primary full" id="createGroupBtn">إنشاء مجموعة</button><div id="groupRows"></div>';
 $("#createGroupBtn").onclick=()=>modal("إنشاء مجموعة",`
  <input class="field" id="groupName" placeholder="اسم المجموعة">
  <textarea class="field" id="groupDesc" placeholder="وصف المجموعة"></textarea>
  <label class="muted"><input type="checkbox" id="groupPrivate"> مجموعة خاصة</label>
  <button class="primary full" id="saveGroup">إنشاء</button>`);
 const rows=await loadGroups();
 const box=$("#groupRows");
 rows.forEach(g=>addListRow(box,g.name,g.description||"مجموعة NOVA"));
}
async function renderStoryPage(){
 $("#listArea").innerHTML='<button class="primary full" id="addStory">إضافة حالة</button><div id="storyRows"></div>';
 $("#addStory").onclick=()=>modal("حالة جديدة",`
  <textarea class="field" id="storyText" placeholder="اكتب ما تريد مشاركته..."></textarea>
  <input class="field" type="file" id="storyFile" accept="image/*,video/*">
  <button class="primary full" id="publishStory">نشر الحالة</button>`);
 const rows=await loadStories();
 rows.forEach(s=>addListRow($("#storyRows"),s.body||"حالة بصورة",new Date(s.created_at).toLocaleString("ar-EG")));
}
async function renderChannelPage(){
 $("#listArea").innerHTML='<button class="primary full" id="newChannel">إنشاء قناة</button><div id="channelRows"></div>';
 $("#newChannel").onclick=()=>modal("إنشاء قناة",`
  <input class="field" id="channelTitle" placeholder="اسم القناة">
  <textarea class="field" id="channelDesc" placeholder="الوصف"></textarea>
  <label class="muted"><input type="checkbox" id="channelPublic" checked> قناة عامة</label>
  <button class="primary full" id="saveChannel">إنشاء</button>`);
 const rows=await loadPublicTable("channels");
 rows.forEach(c=>addListRow($("#channelRows"),c.title,c.description));
}
async function renderCommunityPage(){
 $("#listArea").innerHTML='<button class="primary full" id="newCommunity">إنشاء مجتمع</button><div id="communityRows"></div>';
 $("#newCommunity").onclick=()=>modal("إنشاء مجتمع",`
  <input class="field" id="communityName" placeholder="اسم المجتمع">
  <textarea class="field" id="communityDesc" placeholder="الوصف"></textarea>
  <label class="muted"><input type="checkbox" id="communityPublic" checked> مجتمع عام</label>
  <button class="primary full" id="saveCommunity">إنشاء</button>`);
 const rows=await loadPublicTable("communities");
 rows.forEach(c=>addListRow($("#communityRows"),c.name,c.description));
}
function renderProfile(){
 const p=state.profile||{};
 $("#content").innerHTML=`
 <div class="profile-cover" style="${p.cover_path?`background-image:url('${safe(p.cover_path)}');background-size:cover;background-position:center`:''}"></div>
 <div class="profile-avatar">${p.avatar_path?`<img src="${safe(p.avatar_path)}">`:safe((p.display_name||"N").charAt(0))}</div>
 <div class="profile-body">
  <h2>${safe(p.display_name||"عضو NOVA")}</h2>
  <p class="muted">${safe(p.nova_id||p.user_code||"")}</p>
  <p>${safe(p.bio||"لا توجد نبذة بعد.")}</p>
  <button class="primary" id="editProfile">تعديل الملف الشخصي</button>
 </div>`;
}
function renderSettings(){
 $("#content").innerHTML=`
 <h2>الإعدادات</h2>
 <div class="setting"><span>المظهر</span><select class="field" id="themeSelect" style="width:130px;margin:0"><option value="dark">داكن</option><option value="light">فاتح</option><option value="system">تلقائي</option></select></div>
 <div class="setting"><span>اللغة</span><select class="field" id="langSelect" style="width:130px;margin:0"><option value="ar">العربية</option><option value="en">English</option></select></div>
 <div class="setting"><span>الخصوصية</span><span class="muted">إعدادات الحساب</span></div>
 <button class="primary full" id="savePrefs">حفظ الإعدادات</button>
 <button class="danger full" id="logoutBtn">تسجيل الخروج</button>`;
 $("#themeSelect").value=state.settings?.theme||"dark";
 $("#langSelect").value=state.settings?.language||"ar";
}

/* ---------------- UI ACTION DELEGATION ---------------- */

document.addEventListener("click",async e=>{
 const t=e.target;
 try{
  if(t.closest("[data-chat]")){
   const id=t.closest("[data-chat]").dataset.chat;
   const p=state.people.find(x=>x.id===id)||state.conversations.find(x=>x.other?.id===id)?.other;
   if(p){await startDirect(p);closeModal()}
  }
  if(t.closest("[data-accept]")){
   await acceptFriend(t.closest("[data-accept]").dataset.accept);
   t.closest("[data-accept]").remove();
  }
  if(t.id==="peopleSearchBtn"){
   const rows=await searchPeople($("#peopleQuery").value);
   $("#peopleResults").innerHTML=rows.map(p=>`
    <div class="setting"><span>${safe(p.display_name)} <small class="muted">${safe(p.nova_id||"")}</small></span>
    <button class="primary" data-add-friend="${p.id}">إضافة</button>
    <button class="secondary" data-chat="${p.id}">مراسلة</button></div>`).join("")||'<p class="muted">لا توجد نتائج.</p>';
  }
  if(t.closest("[data-add-friend]")){
   await sendFriendRequest(t.closest("[data-add-friend]").dataset.addFriend);
   t.closest("[data-add-friend]").disabled=true;
  }
  if(t.id==="saveGroup"){
   const name=$("#groupName").value.trim();
   if(!name)throw Error("اكتب اسم المجموعة.");
   await createGroup(name,$("#groupDesc").value,$("#groupPrivate").checked);
   closeModal();await renderGroupPage();
  }
  if(t.id==="publishStory"){
   await createStory($("#storyText").value,$("#storyFile").files[0]);
   closeModal();await renderStoryPage();
  }
  if(t.id==="saveChannel"){
   await createChannel($("#channelTitle").value.trim(),$("#channelDesc").value,$("#channelPublic").checked);
   closeModal();await renderChannelPage();
  }
  if(t.id==="saveCommunity"){
   await createCommunity($("#communityName").value.trim(),$("#communityDesc").value,$("#communityPublic").checked);
   closeModal();await renderCommunityPage();
  }
  if(t.id==="editProfile"){
   const p=state.profile;
   modal("تعديل الملف الشخصي",`
    <input class="field" name="display_name" id="editDisplay" value="${safe(p.display_name||"")}" placeholder="الاسم">
    <input class="field" name="username" id="editUsername" value="${safe(p.username||"")}" placeholder="اسم المستخدم">
    <textarea class="field" name="bio" id="editBio" placeholder="نبذة">${safe(p.bio||"")}</textarea>
    <label class="muted">الصورة الشخصية</label><input class="field" type="file" id="profileAvatarFile" accept="image/*">
    <label class="muted">صورة الغلاف</label><input class="field" type="file" id="profileCoverFile" accept="image/*">
    <button class="primary full" id="saveProfileBtn">حفظ</button>`);
  }
  if(t.id==="saveProfileBtn"){
   const fd=new FormData();
   fd.set("display_name",$("#editDisplay").value);
   fd.set("username",$("#editUsername").value);
   fd.set("bio",$("#editBio").value);
   await saveProfile(fd);closeModal();renderProfile();
  }
  if(t.id==="savePrefs"){
   await saveSettings({theme:$("#themeSelect").value,language:$("#langSelect").value});
  }
  if(t.id==="logoutBtn")await logout();
  if(t.id==="chatMore" && state.current){
   modal("خيارات المحادثة",`
    <button class="secondary full" id="refreshChat">تحديث الرسائل</button>
    <button class="secondary full" id="closeChat">إغلاق المحادثة</button>`);
  }
  if(t.id==="refreshChat"){await loadMessages();closeModal()}
  if(t.id==="closeChat"){state.current=null;unsubscribeConversation();$("#app").classList.remove("chat-open");$("#message").disabled=true;$("#sendBtn").disabled=true;closeModal()}
  if(t.id==="callBtn"||t.id==="videoBtn")toast("المكالمات تحتاج تجهيز خدمة WebRTC والإشارة قبل تشغيلها.");
  if(t.id==="searchInChat"){
   modal("البحث في المحادثة",`<input class="field" id="chatSearchTerm" placeholder="ابحث داخل الرسائل"><div id="chatSearchResults"></div>`);
  }
 }catch(err){toast(errorText(err))}
});

$$(".nav[data-page]").forEach(b=>b.addEventListener("click",async()=>{
 try{
  const page=b.dataset.page;
  if(page==="friends")await showFriends();
  else showPage(page);
 }catch(e){toast(errorText(e))}
}));
$("#newBtn").onclick=()=>modal("إنشاء جديد",`
 <button class="secondary full" id="newFriend">البحث عن صديق</button>
 <button class="secondary full" id="newGroup">إنشاء مجموعة</button>
 <button class="secondary full" id="newStory">إضافة حالة</button>`);
$("#back").onclick=()=>$("#app").classList.remove("chat-open");
$("#attachBtn").onclick=()=>toast("رفع المرفقات في المحادثات يحتاج تحديد bucket وسياسات Storage.");
$("#chatSearchTerm")?.addEventListener("input",()=>{});
$("#content").addEventListener("click",e=>{
 if(e.target.id==="editProfile")return;
});
$("#message").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#composer").requestSubmit()}
});

/* ---------------- START ---------------- */

(async()=>{
 try{await boot()}
 catch(e){
  console.error(e);
  showAuth("تعذر الاتصال أو تحميل الحساب: "+errorText(e));
 }
})();
</script>
</body>
</html>
