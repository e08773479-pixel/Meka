<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#071c18">

<meta name="description"
content="MEKA - منصة التواصل والمراسلة الحديثة">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MEKA — ميكا</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23071c18'/%3E%3Cpath d='M20 75V25L50 58 80 25V75' fill='none' stroke='%2310b981' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="./styles.css">

<style>

/* ==================================
   MEKA CRITICAL STARTUP
================================== */

:root {
  color-scheme: dark;
  --meka-bg: #071c18;
  --meka-green: #10b981;
  --meka-white: #f0fdf7;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--meka-bg);
}

body {
  font-family: system-ui, Arial, sans-serif;
  color: var(--meka-white);
  overflow-x: hidden;
}

/* ==================================
   SPLASH SCREEN
================================== */

#mekaSplash {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(16,185,129,.16),
      transparent 45%
    ),
    linear-gradient(145deg,#0b2920,#04130f);

  transition:
    opacity .65s ease,
    visibility .65s ease;
}

#mekaSplash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash-content {
  display: flex;
  align-items: center;
  flex-direction: column;
  animation: splashAppear 1s ease both;
}

.meka-logo {
  width: 112px;
  height: 112px;
  border-radius: 32px;

  display: grid;
  place-items: center;

  background: linear-gradient(
    145deg,
    #164b38,
    #071c18
  );

  border: 1px solid rgba(110,231,183,.25);

  box-shadow:
    0 0 40px rgba(16,185,129,.18),
    inset 0 0 25px rgba(16,185,129,.08);

  animation: logoFloat 2s ease-in-out infinite;
}

.meka-logo svg {
  width: 76px;
  height: 76px;

  filter: drop-shadow(
    0 0 12px rgba(16,185,129,.4)
  );
}

.splash-title {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 5px;
  margin-top: 24px;

  background: linear-gradient(
    90deg,
    #6ee7b7,
    #10b981,
    #d1fae5
  );

  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.splash-subtitle {
  color: #8bb5a3;
  font-size: 13px;
  margin-top: 8px;
}

.splash-loader {
  width: 155px;
  height: 3px;
  border-radius: 20px;
  background: rgba(255,255,255,.09);
  margin-top: 38px;
  overflow: hidden;
}

.splash-loader::after {
  content: "";
  display: block;
  height: 100%;
  width: 35%;
  background: #10b981;
  border-radius: inherit;
  animation: loaderMove 1.1s ease-in-out infinite;
}

.splash-footer {
  position: absolute;
  bottom: 35px;
  color: #58796b;
  font-size: 11px;
  letter-spacing: 2px;
}

@keyframes logoFloat {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-9px);
  }
}

@keyframes splashAppear {
  from {
    opacity: 0;
    transform: scale(.88);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes loaderMove {
  0% {
    transform: translateX(180%);
  }

  100% {
    transform: translateX(-350%);
  }
}

/* ==================================
   STARTUP VISIBILITY
================================== */

#mekaAuth,
#mekaApp {
  display: none;
}

body.meka-ready #mekaAuth {
  display: block;
}

body.meka-ready #mekaApp.is-active {
  display: block;
}

body.meka-ready #mekaAuth.is-hidden {
  display: none;
}

/* ==================================
   INSTALL BUTTON
================================== */

.meka-install-button {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 9px;

  padding: 11px 18px;

  border: 1px solid rgba(16,185,129,.35);
  border-radius: 13px;

  background: rgba(16,185,129,.12);
  color: #6ee7b7;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

.meka-install-button.visible {
  display: inline-flex;
}

.meka-install-button:active {
  transform: scale(.97);
}

/* ==================================
   BASIC AUTH SCREEN
================================== */

#mekaAuth {
  min-height: 100vh;
  min-height: 100dvh;

  padding: 25px 18px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(16,185,129,.12),
      transparent 40%
    ),
    #071c18;
}

.auth-wrapper {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
}

.auth-brand {
  text-align: center;
  padding: 28px 0;
}

.auth-brand .meka-logo {
  width: 76px;
  height: 76px;
  margin: auto;
  border-radius: 23px;
}

.auth-brand .meka-logo svg {
  width: 54px;
  height: 54px;
}

.auth-brand h1 {
  margin: 13px 0 4px;
  font-size: 28px;
}

.auth-brand p {
  color: #8ba99c;
  font-size: 13px;
}

.auth-card {
  padding: 25px;
  border-radius: 22px;

  background: rgba(16,42,34,.94);

  border: 1px solid rgba(255,255,255,.07);

  box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.auth-card h2 {
  margin-top: 0;
  font-size: 21px;
}

.auth-card .auth-description {
  color: #8ba99c;
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 23px;
}

.auth-field {
  margin-bottom: 17px;
}

.auth-field label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: #c4d8cf;
}

.auth-field input {
  width: 100%;
  min-height: 49px;

  padding: 12px 14px;

  border: 1px solid #29483c;
  border-radius: 12px;

  background: #091f18;
  color: white;

  outline: none;
  font-size: 14px;
}

.auth-field input:focus {
  border-color: #10b981;
  box-shadow: 0 0 0 3px rgba(16,185,129,.1);
}

.auth-primary,
.auth-google {
  width: 100%;
  min-height: 49px;

  border: 0;
  border-radius: 12px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

.auth-primary {
  color: #04271c;
  background: linear-gradient(120deg,#6ee7b7,#10b981);
}

.auth-google {
  margin-top: 12px;
  color: white;
  background: #19382c;
  border: 1px solid #315344;
}

.auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #759486;
  font-size: 12px;
}

.auth-divider::before,
.auth-divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: #29483c;
}

.auth-links {
  text-align: center;
  font-size: 13px;
  color: #8ba99c;
  margin-top: 20px;
}

.auth-links button {
  background: none;
  border: none;
  color: #6ee7b7;
  font-weight: bold;
  cursor: pointer;
}

#authMessage {
  min-height: 20px;
  margin-top: 12px;
  color: #fca5a5;
  font-size: 12px;
  text-align: center;
}

/* ==================================
   APP INITIAL STRUCTURE
================================== */

#mekaApp {
  min-height: 100vh;
  min-height: 100dvh;
  background: #071c18;
}

.meka-app-header {
  min-height: 65px;
  padding: 12px 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: #102a23;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.meka-app-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  font-size: 20px;
}

.meka-app-brand svg {
  width: 34px;
  height: 34px;
}

.meka-main-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: calc(100dvh - 65px);
}

.meka-sidebar {
  padding: 15px;
  border-left: 1px solid rgba(255,255,255,.06);
  background: #0b211a;
}

.meka-nav-button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 7px;

  text-align: right;
  color: #b9d3c7;

  background: transparent;
  border: 0;
  border-radius: 12px;

  font-size: 14px;
  cursor: pointer;
}

.meka-nav-button.active {
  background: rgba(16,185,129,.13);
  color: #6ee7b7;
}

.meka-content {
  min-width: 0;
  padding: 20px;
}

.meka-empty-state {
  min-height: 65vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  color: #9ab6a8;
}

.meka-empty-state h2 {
  color: #e1f5eb;
}

.meka-empty-state p {
  max-width: 350px;
  font-size: 13px;
  line-height: 1.8;
}

@media(max-width:760px) {

  .meka-main-layout {
    display: block;
  }

  .meka-sidebar {
    display: flex;
    overflow-x: auto;
    padding: 8px;
    border: none;
  }

  .meka-nav-button {
    min-width: max-content;
    width: auto;
    margin: 0 3px;
    text-align: center;
  }

  .meka-content {
    padding: 12px;
  }

  .auth-card {
    padding: 20px;
  }
}

</style>
</head>

<body>

<!-- ==================================
     MEKA SPLASH SCREEN
================================== -->

<div id="mekaSplash">

  <div class="splash-content">

    <div class="meka-logo">

      <svg viewBox="0 0 100 100"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">

        <path
        d="M15 78V22L50 62L85 22V78"
        stroke="#6EE7B7"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>

      </svg>

    </div>

    <div class="splash-title">MEKA</div>

    <div class="splash-subtitle">
      عالمك للتواصل والمراسلة
    </div>

    <div class="splash-loader"></div>

  </div>

  <div class="splash-footer">
    CONNECT WITHOUT LIMITS
  </div>

</div>


<!-- ==================================
     AUTHENTICATION
================================== -->

<section id="mekaAuth">

  <div class="auth-wrapper">

    <div class="auth-brand">

      <div class="meka-logo">

        <svg viewBox="0 0 100 100"
        fill="none">

          <path
          d="M15 78V22L50 62L85 22V78"
          stroke="#6EE7B7"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"/>

        </svg>

      </div>

      <h1>MEKA</h1>

      <p>تواصل مع العالم بطريقتك</p>

      <button
        id="installAppBtn"
        class="meka-install-button"
        type="button">

        <span>↓</span>
        تثبيت تطبيق MEKA

      </button>

    </div>


    <!-- LOGIN -->

    <div class="auth-card" id="loginPanel">

      <h2>مرحباً بعودتك</h2>

      <p class="auth-description">
        سجّل الدخول إلى حسابك لمتابعة محادثاتك.
      </p>

      <form id="loginForm">

        <div class="auth-field">

          <label for="loginEmail">
            البريد الإلكتروني
          </label>

          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required>

        </div>

        <div class="auth-field">

          <label for="loginPassword">
            كلمة المرور
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="كلمة المرور"
            required>

        </div>

        <button
          class="auth-primary"
          type="submit">

          تسجيل الدخول

        </button>

      </form>

      <div class="auth-divider">
        أو
      </div>

      <button
        id="googleSignInBtn"
        class="auth-google"
        type="button">

        المتابعة باستخدام Google

      </button>

      <div class="auth-links">

        ليس لديك حساب؟

        <button id="showSignupBtn" type="button">
          إنشاء حساب
        </button>

      </div>

      <div id="authMessage" aria-live="polite"></div>

    </div>


    <!-- SIGN UP -->

    <div class="auth-card" id="signupPanel" hidden>

      <h2>إنشاء حساب جديد</h2>

      <p class="auth-description">
        أنشئ حساب MEKA وابدأ التواصل.
      </p>

      <form id="signupForm">

        <div class="auth-field">

          <label for="signupName">
            الاسم
          </label>

          <input
            id="signupName"
            type="text"
            autocomplete="name"
            placeholder="اسمك"
            required>

        </div>

        <div class="auth-field">

          <label for="signupUsername">
            اسم المستخدم
          </label>

          <input
            id="signupUsername"
            type="text"
            autocomplete="username"
            placeholder="username"
            minlength="3"
            required>

        </div>

        <div class="auth-field">

          <label for="signupEmail">
            البريد الإلكتروني
          </label>

          <input
            id="signupEmail"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required>

        </div>

        <div class="auth-field">

          <label for="signupPassword">
            كلمة المرور
          </label>

          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="8 أحرف على الأقل"
            required>

        </div>

        <button
          class="auth-primary"
          type="submit">

          إنشاء الحساب

        </button>

      </form>

      <div class="auth-links">

        لديك حساب بالفعل؟

        <button id="showLoginBtn" type="button">
          تسجيل الدخول
        </button>

      </div>

    </div>

  </div>

</section>


<!-- ==================================
     MAIN APPLICATION
================================== -->

<div id="mekaApp">

      </button>

      <button
        class="meka-nav-button"

      </button>

      <button
        class="meka-nav-button"

        المنشورات

      </button>

      <button
        class="meka-nav-button"

      </button>

      <button

      <section id="page-chats">

          </p>

        </div>

      </section>


      <section id="page-contacts" hidden></section>

      <section id="page-stories" hidden></section>

      <section id="page-calls" hidden></section>

      <section id="page-feed" hidden></section>

      <section id="page-profile" hidden></section>

    </main>

  </div>

</div>


<!-- ==================================
     TOAST / MODAL
================================== -->

<div id="mekaToast"
style="
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
z-index:1000000;
padding:12px 20px;
background:#173c2d;
color:#fff;
border-radius:12px;
font-size:13px;
display:none;
max-width:90%;
text-align:center;
"
role="status"
aria-live="polite">
</div>


<!-- ==================================
     FIVE SECOND STARTUP
     INDEPENDENT OF app.js
================================== -->

<script>

(function () {

  "use strict";

  const splash = document.getElementById("mekaSplash");

  const startTime = Date.now();

  const SPLASH_DURATION = 5000;

  function finishSplash() {

    const elapsed = Date.now() - startTime;

    const remaining = Math.max(
      0,
      SPLASH_DURATION - elapsed
    );

    if (remaining > 0) {
      setTimeout(finishSplash, remaining);
      return;
    }

    document.body.classList.add("meka-ready");

    splash.classList.add("hide");

    setTimeout(function () {

      splash.remove();

    }, 750);

  }

  setTimeout(finishSplash, SPLASH_DURATION);


  /* LOGIN / SIGNUP SWITCH */

  const loginPanel = document.getElementById("loginPanel");

  const signupPanel = document.getElementById("signupPanel");

  document.getElementById("showSignupBtn")
    .addEventListener("click", function () {

      loginPanel.hidden = true;

      signupPanel.hidden = false;

    });

  document.getElementById("showLoginBtn")
    .addEventListener("click", function () {

      signupPanel.hidden = true;

      loginPanel.hidden = false;

    });


  /* PWA INSTALLATION */

  let installPrompt = null;

  const installButtons = [

    document.getElementById("installAppBtn"),

    document.getElementById("headerInstallBtn")

  ];

  function showInstallButtons() {

    installButtons.forEach(function (button) {

      if (button) {
        button.classList.add("visible");
      }

    });

  }

  function hideInstallButtons() {

    installButtons.forEach(function (button) {

      if (button) {
        button.classList.remove("visible");
      }

    });

  }

  window.addEventListener(
    "beforeinstallprompt",
    function (event) {

      event.preventDefault();

      installPrompt = event;

      showInstallButtons();

    }
  );

  installButtons.forEach(function (button) {

    if (!button) return;

    button.addEventListener("click", async function () {

      if (installPrompt) {

        installPrompt.prompt();

        const result = await installPrompt.userChoice;

        if (result.outcome === "accepted") {

          hideInstallButtons();

        }

        installPrompt = null;

        return;

      }

      showToast(
        "إذا لم يظهر التثبيت، افتح قائمة المتصفح واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية."
      );

    });

  });


  window.addEventListener(
    "appinstalled",
    function () {

      hideInstallButtons();

      showToast("تم تثبيت MEKA بنجاح.");

    }
  );


  /* SERVICE WORKER */

  if (
    "serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")
  ) {

    window.addEventListener("load", function () {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function (error) {

          console.error(
            "MEKA Service Worker:",
            error
          );

        });

    });

  }


  /* TOAST */

  window.showToast = function (message) {

    const toast = document.getElementById("mekaToast");

    if (!toast) return;

    toast.textContent = message;

    toast.style.display = "block";

    clearTimeout(window.mekaToastTimer);

    window.mekaToastTimer = setTimeout(function () {

      toast.style.display = "none";

    }, 3500);

  };


})();

</script>


<!-- ==================================
     APPLICATION JAVASCRIPT
================================== -->

<script type="module" src="./app.js"></script>

</body>
</html>
