
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>NOVA Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --green:#075e54;--green2:#128c7e;--lightgreen:#d9fdd3;
 --bg:#edf2f0;--panel:#fff;--soft:#f6f9f8;--text:#172b29;
 --muted:#778783;--line:#e5ece9;--red:#dc4854;
 --shadow:0 8px 30px #163b3210
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.shell{height:100dvh;max-width:1600px;margin:auto;background:var(--panel);display:grid;grid-template-columns:76px 350px minmax(0,1fr);overflow:hidden;box-shadow:var(--shadow)}
.rail{background:#f7faf9;border-left:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:13px 8px;gap:9px}
.brand{height:48px;width:48px;border-radius:16px;background:linear-gradient(140deg,#1bc99a,#08766b);display:grid;place-items:center;color:white;font-size:23px;font-weight:900;margin-bottom:13px}
.rail button{border:0;background:transparent;color:#6b7b78;width:49px;height:49px;border-radius:15px;font-size:21px}
.rail button.active,.rail button:hover{background:#dff4ed;color:var(--green)}
.rail .push{flex:1}
.sidebar{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 17px 12px;display:flex;justify-content:space-between;align-items:center}
.side-head h2{margin:0;font-size:23px;font-weight:900;color:var(--green)}
.actions{display:flex;gap:7px}
.icon-btn{border:0;background:var(--soft);color:var(--green);width:39px;height:39px;border-radius:13px;font-size:18px}
.search{margin:0 14px 12px;position:relative}
.search input{width:100%;border:0;background:#f1f5f3;border-radius:13px;padding:11px 40px 11px 12px;outline:none}
.search:before{content:"⌕";position:absolute;right:14px;top:3px;font-size:25px;color:var(--muted)}
.tabs{display:flex;gap:5px;padding:0 12px 10px;overflow:auto}
.tabs button{border:0;border-radius:20px;padding:7px 13px;background:#f2f6f4;color:var(--muted);white-space:nowrap;font-size:12px}
.tabs button.active{background:#dff4ed;color:var(--green);font-weight:800}
.list{overflow:auto;flex:1}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid #f1f4f3}
.list-item:hover,.list-item.selected{background:#f0f8f5}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:linear-gradient(145deg,#c4e9df,#e8f4ef);display:grid;place-items:center;color:var(--green);font-weight:900;font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.item-info{min-width:0;flex:1}
.item-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:10px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#e9f0ed;position:relative}
.welcome{margin:auto;text-align:center;padding:25px;color:var(--muted)}
.welcome .big-logo{font-size:70px;color:var(--green)}
.welcome h1{color:var(--green);font-size:30px;margin:5px}
.chat-head{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px 17px;gap:12px}
.chat-head .head-info{flex:1;min-width:0}
.chat-head strong{display:block}
.chat-head small{color:var(--muted)}
.chat-tools{display:flex;gap:6px}
.chat-tools button{border:0;background:#f1f6f4;color:var(--green);width:39px;height:39px;border-radius:13px}
.messages{flex:1;overflow:auto;padding:22px 6%;display:flex;flex-direction:column;gap:8px;background-color:#e9f0ed;background-image:radial-gradient(#d7e2dd 0.7px,transparent .7px);background-size:18px 18px}
.bubble{max-width:min(76%,520px);padding:9px 12px 6px;border-radius:14px;background:#fff;box-shadow:0 1px 2px #0000000b;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--lightgreen);border-top-left-radius:4px}
.bubble:not(.mine){border-top-right-radius:4px}
.bubble .sender{font-size:11px;font-weight:900;color:var(--green)}
.bubble .body{font-size:14px;white-space:pre-wrap}
.bubble .time{font-size:9px;color:#7d8b86;text-align:left;margin-top:3px}
.bubble img,.bubble video{max-width:100%;max-height:280px;border-radius:9px}
.composer{background:#f7faf9;padding:10px 13px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;max-height:120px;border:0;border-radius:13px;padding:11px 13px;outline:none;background:#fff;min-height:44px}
.composer button{border:0;background:var(--green);color:white;width:44px;height:44px;border-radius:14px;font-size:19px}
.composer .attach{background:#e5f1ed;color:var(--green)}
.panel-view{position:absolute;inset:0;background:#fff;z-index:4;overflow:auto;padding:20px}
.panel-title{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}
.panel-title h2{margin:0;color:var(--green);font-size:21px;flex:1}
.panel-title button{border:0;background:#eef5f2;color:var(--green);border-radius:10px;padding:8px 13px}
.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;background:#fff}
.card h3{margin:0 0 9px;color:var(--green)}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;outline:none;background:#fbfdfc}
.primary{border:0;border-radius:11px;background:var(--green);color:#fff;padding:10px 16px;font-weight:800}
.secondary{border:0;border-radius:11px;background:#eaf4f0;color:var(--green);padding:10px 14px;font-weight:700}
.danger{background:#fff0f0;color:var(--red)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.stat{background:#f1f8f5;border-radius:13px;padding:13px;text-align:center}
.stat b{display:block;color:var(--green);font-size:23px}
.stat small{color:var(--muted)}
.story-strip{display:flex;gap:13px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
.story{min-width:64px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer}
.story .avatar{width:58px;height:58px;border:3px solid #20ae83;padding:2px}
.empty{text-align:center;color:var(--muted);padding:25px;font-size:13px}
#toast{position:fixed;z-index:30;bottom:25px;left:50%;transform:translateX(-50%);background:#173d36;color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;display:none;max-width:90vw}
#auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#e5f4ee,#f7faf8)}
.auth-card{background:#fff;width:min(440px,100%);padding:27px;border-radius:23px;box-shadow:var(--shadow)}
.auth-logo{text-align:center;color:var(--green);font-size:35px;font-weight:900}
.auth-card h2{text-align:center;margin:0 0 15px}
.auth-switch{text-align:center;color:var(--green);cursor:pointer;margin-top:13px;font-size:13px}
.mobile-bar{display:none}
@media(max-width:850px){
 .shell{grid-template-columns:1fr;grid-template-rows:1fr 62px}
 .rail{display:none}.sidebar{display:flex;border:0}.main{display:none}
 .shell.in-chat .sidebar{display:none}.shell.in-chat .main{display:flex}
 .mobile-bar{display:flex;grid-row:2;background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center}
 .mobile-bar button{border:0;background:none;color:var(--muted);font-size:20px}
 .mobile-bar button.active{color:var(--green)}
 .messages{padding:15px 12px}
 .chat-head{height:62px}
 .panel-view{padding:14px}
}
</style>
</head>
<body>

<section id="auth">
 <div class="auth-card">
  <div class="auth-logo">✦ NOVA</div>
  <h2 id="auth-heading">مرحباً بك في NOVA</h2>
  <div class="field"><label>البريد الإلكتروني</label><input id="auth-email" type="email" placeholder="name@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="auth-password" type="password" placeholder="••••••••"></div>
  <div class="field hidden" id="name-field"><label>اسمك الظاهر</label><input id="auth-name" placeholder="اكتب اسمك"></div>
  <button class="primary" id="auth-submit" style="width:100%" onclick="submitAuth()">تسجيل الدخول</button>
  <div class="auth-switch" id="auth-switch" onclick="toggleAuth()">إنشاء حساب جديد</div>
  <p style="font-size:11px;color:#82918c;text-align:center">بالتسجيل أنت توافق على شروط استخدام NOVA.</p>
 </div>
</section>

<div class="shell hidden" id="app">
 <aside class="rail">
  <div class="brand">N</div>
  <button class="active" title="المحادثات" onclick="showSection('chats',this)">▤</button>
  <button title="الحالات" onclick="showSection('stories',this)">◉</button>
  <button title="الأصدقاء" onclick="showSection('friends',this)">♧</button>
  <button title="المجموعات" onclick="showSection('groups',this)">♧</button>
  <button title="القنوات" onclick="showSection('channels',this)">◈</button>
  <button title="المجتمعات" onclick="showSection('communities',this)">⌘</button>
  <div class="push"></div>
  <button title="الملف الشخصي" onclick="showSection('profile',this)">◉</button>
  <button title="الإعدادات" onclick="showSection('settings',this)">⚙</button>
 </aside>

 <section class="sidebar">
  <header class="side-head">
   <h2>NOVA</h2>
   <div class="actions">
    <button class="icon-btn" title="محادثة جديدة" onclick="newChat()">＋</button>
    <button class="icon-btn" title="قائمة" onclick="showSection('settings')">⋮</button>
   </div>
  </header>
  <div class="search"><input id="list-search" placeholder="ابحث في المحادثات..." oninput="filterList()"></div>
  <div class="story-strip" id="story-strip"></div>
  <div class="tabs">
   <button class="active" onclick="setListFilter('all',this)">الكل</button>
   <button onclick="setListFilter('unread',this)">غير مقروءة</button>
   <button onclick="setListFilter('groups',this)">مجموعات</button>
   <button onclick="setListFilter('friends',this)">أصدقاء</button>
  </div>
  <div class="list" id="conversation-list"><div class="empty">جاري تحميل المحادثات...</div></div>
 </section>

 <main class="main" id="main">
  <div class="welcome" id="welcome">
   <div class="big-logo">✦</div><h1>NOVA Messenger</h1>
   <p>رسائلك وأصدقاؤك ومجتمعاتك في مكان واحد.</p>
   <button class="primary" onclick="newChat()">ابدأ محادثة جديدة</button>
  </div>
  <section id="chat-screen" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
   <header class="chat-head">
    <button class="icon-btn" onclick="backToList()" style="display:none" id="back-button">‹</button>
    <div class="avatar" id="chat-avatar">N</div>
    <div class="head-info"><strong id="chat-title">المحادثة</strong><small id="chat-subtitle">NOVA</small></div>
    <div class="chat-tools">
     <button title="بحث في الرسائل" onclick="searchMessages()">⌕</button>
     <button title="مكالمة صوتية" onclick="startCall('audio')">☎</button>
     <button title="مكالمة فيديو" onclick="startCall('video')">▣</button>
     <button title="معلومات المحادثة" onclick="conversationInfo()">ⓘ</button>
    </div>
   </header>
   <div class="messages" id="messages"></div>
   <div class="composer">
    <button class="attach" title="إرفاق ملف" onclick="document.getElementById('file-input').click()">＋</button>
    <input type="file" id="file-input" class="hidden" onchange="uploadAttachment(this.files[0])">
    <textarea id="message-input" rows="1" placeholder="اكتب رسالة..." onkeydown="messageKeydown(event)"></textarea>
    <button title="إرسال" onclick="sendMessage()">➤</button>
   </div>
  </section>
  <section id="panel" class="panel-view hidden"></section>
 </main>

 <nav class="mobile-bar">
  <button class="active" onclick="mobileSection('chats',this)">▤</button>
  <button onclick="mobileSection('stories',this)">◉</button>
  <button onclick="mobileSection('friends',this)">♧</button>
  <button onclick="mobileSection('groups',this)">⌘</button>
  <button onclick="mobileSection('settings',this)">⚙</button>
 </nav>
</div>
<div id="toast"></div>

<script>
/* ================== إعداد الاتصال ================== */
const SUPABASE_URL = "https://rtlxnzyzlkezukyfgjbs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qQJb_EzE3NgW74IxkwRDmw_0y4XIymI";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentUser=null, myProfile=null, currentConversation=null;
let conversations=[], activeChannel=null, authMode="login", currentFilter="all";
let messageCache=[], friendCache=[], profileCache=[];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=s=>(s||"?").trim().slice(0,1).toUpperCase();

function toast(message){
 const el=$("toast");el.textContent=message;el.style.display="block";
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",3000);
}
function showAuth(){ $("auth").classList.remove("hidden");$("app").classList.add("hidden");}
function showApp(){ $("auth").classList.add("hidden");$("app").classList.remove("hidden");}
function toggleAuth(){
 authMode=authMode==="login"?"signup":"login";
 $("auth-heading").textContent=authMode==="login"?"مرحباً بك في NOVA":"إنشاء حساب NOVA";
 $("auth-submit").textContent=authMode==="login"?"تسجيل الدخول":"إنشاء الحساب";
 $("auth-switch").textContent=authMode==="login"?"إنشاء حساب جديد":"لديك حساب؟ تسجيل الدخول";
 $("name-field").classList.toggle("hidden",authMode!=="signup");
}
async function submitAuth(){
 const email=$("auth-email").value.trim(),password=$("auth-password").value;
 if(!email||!password)return toast("اكتب البريد الإلكتروني وكلمة المرور");
 $("auth-submit").disabled=true;
 try{
  let result;
  if(authMode==="signup"){
   result=await db.auth.signUp({email,password,options:{data:{display_name:$("auth-name").value.trim()||email.split("@")[0]}}});
   if(result.error)throw result.error;
   if(!result.data.session){
    toast("تم إنشاء الحساب. راجع بريدك لتأكيد التسجيل إذا طُلب منك ذلك.");
    return;
   }
  }else{
   result=await db.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
  }
  currentUser=result.data.user;
  await ensureProfile();
  await boot();
 }catch(e){toast(e.message||"تعذر تسجيل الدخول");}
 finally{$("auth-submit").disabled=false;}
}
async function ensureProfile(){
 const {data:existing,error:readError}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
 if(readError)throw readError;
 if(existing){myProfile=existing;return existing;}
 const display=currentUser.user_metadata?.display_name||currentUser.email?.split("@")[0]||"عضو NOVA";
 const {data,error}=await db.from("profiles").insert({id:currentUser.id,display_name:display}).select("*").single();
 if(error)throw error;
 myProfile=data;return data;
}
async function boot(){
 showApp();
 $("welcome").classList.remove("hidden");$("chat-screen").classList.add("hidden");
 await ensureProfile();
 await Promise.all([loadConversations(),loadFriends(),loadStories()]);
 subscribeRealtime();
}
async function signOut(){
 if(activeChannel)await db.removeChannel(activeChannel);
 await db.auth.signOut();currentUser=null;myProfile=null;showAuth();
}

/* ================== الملف الشخصي و NOVA ID ================== */
function profilePage(){
 const p=myProfile||{};
 $("panel").innerHTML=`
 <div class="panel-title"><h2>الملف الشخصي</h2><button onclick="closePanel()">إغلاق</button></div>
 <div class="card" style="text-align:center">
  <div class="avatar" style="width:90px;height:90px;margin:auto;font-size:30px">${escapeHTML(initials(p.display_name))}</div>
  <h2>${escapeHTML(p.display_name)}</h2>
  <p style="color:var(--muted)">NOVA ID: <b>${escapeHTML(p.nova_id||p.user_code||"سيظهر بعد إنشاء الملف")}</b></p>
  <button class="secondary" onclick="copyMyId()">نسخ NOVA ID</button>
 </div>
 <div class="row">
  <div class="stat"><b id="profile-friends">0</b><small>الأصدقاء</small></div>
  <div class="stat"><b id="profile-followers">0</b><small>المتابعون</small></div>
  <div class="stat"><b id="profile-following">0</b><small>يتابعهم</small></div>
 </div>
 <div class="card">
  <h3>تعديل بياناتي</h3>
  <div class="field"><label>الاسم الظاهر</label><input id="edit-display" value="${escapeHTML(p.display_name)}"></div>
  <div class="field"><label>اسم المستخدم</label><input id="edit-username" value="${escapeHTML(p.username||"")}" placeholder="username"></div>
  <div class="field"><label>نبذة عني</label><textarea id="edit-bio">${escapeHTML(p.bio||"")}</textarea></div>
  <button class="primary" onclick="saveProfile()">حفظ التغييرات</button>
 </div>`;
 $("panel").classList.remove("hidden");
 loadProfileCounts();
}
async function copyMyId(){
 const id=myProfile?.nova_id||myProfile?.user_code;
 if(!id)return toast("لم يتم إنشاء NOVA ID بعد");
 await navigator.clipboard.writeText(id);toast("تم نسخ NOVA ID");
}
async function saveProfile(){
 const display_name=$("edit-display").value.trim(),username=$("edit-username").value.trim().toLowerCase(),bio=$("edit-bio").value.trim();
 if(!display_name)return toast("اكتب اسمك");
 const {data,error}=await db.from("profiles").update({display_name,username:username||null,bio}).eq("id",currentUser.id).select("*").single();
 if(error)return toast(error.message);
 myProfile=data;toast("تم حفظ الملف الشخصي");profilePage();
}
async function loadProfileCounts(){
 const [friends,followers,following]=await Promise.all([
  db.from("friendships").select("id",{count:"exact",head:true}).eq("status","accepted").or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`),
  db.from("follows").select("follower_id",{count:"exact",head:true}).eq("followed_id",currentUser.id),
  db.from("follows").select("followed_id",{count:"exact",head:true}).eq("follower_id",currentUser.id)
 ]);
 $("profile-friends").textContent=friends.count??0;
 $("profile-followers").textContent=followers.count??0;
 $("profile-following").textContent=following.count??0;
}

/* ================== المحادثات ================== */
async function loadConversations(){
 const {data:members,error}=await db.from("conversation_members")
  .select("conversation_id,conversations(id,conversation_type,title,last_message_at,created_by)")
  .eq("user_id",currentUser.id).is("archived_at",null);
 if(error){$("conversation-list").innerHTML=`<div class="empty">${escapeHTML(error.message)}</div>`;return;}
 const ids=(members||[]).map(x=>x.conversations).filter(Boolean);
 conversations=ids;
 const results=await Promise.all(conversations.map(async c=>{
  const {data:ms}=await db.from("messages").select("body,message_type,created_at,sender_id")
   .eq("conversation_id",c.id).order("created_at",{ascending:false}).limit(1);
  let title=c.title||"محادثة جديدة",subtitle=ms?.[0]?.body||"ابدأ المحادثة";
  if(c.conversation_type==="direct"){
   const {data:other}=await db.from("conversation_members").select("user_id").eq("conversation_id",c.id).neq("user_id",currentUser.id).limit(1).maybeSingle();
   if(other){
    const {data:p}=await db.from("profiles").select("display_name,avatar_path").eq("id",other.user_id).maybeSingle();
    title=p?.display_name||"مستخدم NOVA";
   }
  }
  return {...c,_title:title,_subtitle:subtitle,_last:ms?.[0]?.created_at||c.last_message_at};
 }));
 conversations=results;
 renderConversationList();
}
function renderConversationList(){
 const query=($("list-search").value||"").toLowerCase();
 let items=conversations.filter(c=>c._title.toLowerCase().includes(query));
 if(currentFilter==="groups")items=items.filter(c=>c.conversation_type==="group");
 $("conversation-list").innerHTML=items.length?items.map(c=>`
 <div class="list-item ${currentConversation?.id===c.id?"selected":""}" onclick="openConversation('${c.id}')">
  <div class="avatar">${escapeHTML(initials(c._title))}</div>
  <div class="item-info"><strong>${escapeHTML(c._title)}</strong><small>${escapeHTML(c._subtitle)}</small></div>
  <div class="item-meta">${c._last?new Date(c._last).toLocaleDateString("ar-EG"):""}</div>
 </div>`).join(""):`<div class="empty">لا توجد محادثات بعد. ابدأ محادثة جديدة.</div>`;
}
function filterList(){renderConversationList()}
function setListFilter(f,button){
 currentFilter=f;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 button.classList.add("active");renderConversationList();
}
async function openConversation(id){
 const c=conversations.find(x=>x.id===id);
 if(!c)return;
 currentConversation=c;

async function loadMessages(){
 if(!currentConversation)return;
 const {data,error}=await db.from("messages").select("*").eq("conversation_id",currentConversation.id)
  .order("created_at",{ascending:true}).limit(300);
 if(error)return toast(error.message);
 messageCache=data||[];renderMessages();
}
function renderMessages(){
 $("messages").innerHTML=messageCache.map(m=>{
  const mine=m.sender_id===currentUser.id;
  let body=escapeHTML(m.body||"");
  if(m.message_type==="image"||m.message_type==="video"||m.message_type==="audio"||m.message_type==="file"){
   body=`<div>${escapeHTML(m.body||"مرفق")}</div>`;
  }
  return `<article class="bubble ${mine?"mine":""}" data-id="${m.id}">
   <div class="body">${body}</div>
   <div class="time">${new Date(m.created_at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}${mine?" ✓✓":""}</div>
  </article>`;
 }).join("");
 $("messages").scrollTop=$("messages").scrollHeight;
}
function messageKeydown(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}
async function sendMessage(){
 const body=$("message-input").value.trim();
 if(!body||!currentConversation)return;
 $("message-input").value="";
 const {data,error}=await db.from("messages").insert({
  conversation_id:currentConversation.id,sender_id:currentUser.id,message_type:"text",body
 }).select("*").single();
 if(error){$("message-input").value=body;return toast(error.message);}
 messageCache.push(data);renderMessages();
 await db.from("conversations").update({last_message_at:new Date().toISOString()}).eq("id",currentConversation.id);
}
async function uploadAttachment(file){
 if(!file||!currentConversation)return;
 const bucket=file.type.startsWith("image/")||file.type.startsWith("video/")||file.type.startsWith("audio/")?"meka-chat-media":"meka-documents";
 const path=`${currentUser.id}/${Date.now()}-${file.name.replace(/[^\w.\-\u0600-\u06ff]/g,"_")}`;
 toast("جاري رفع الملف...");
 const {error:uploadError}=await db.storage.from(bucket).upload(path,file,{upsert:false});
 if(uploadError)return toast(uploadError.message);
 const {data:asset,error:assetError}=await db.from("media_assets").insert({
  owner_id:currentUser.id,storage_path:path,bucket_id:bucket,mime_type:file.type,file_size:file.size
 }).select("id").maybeSingle();
 if(assetError)console.warn(assetError);
 const {data:msg,error}=await db.from("messages").insert({
  conversation_id:currentConversation.id,sender_id:currentUser.id,
  message_type:file.type.startsWith("image/")?"image":file.type.startsWith("video/")?"video":file.type.startsWith("audio/")?"audio":"file",
  body:`${file.name} | ${bucket}/${path}`
 }).select("*").single();
 if(error)return toast(error.message);
 messageCache.push(msg);renderMessages();toast("تم رفع الملف وإرساله");
}

async function createGroup(){
 const title=prompt("اكتب اسم المجموعة");
 if(!title?.trim())return;
 const membersText=prompt("اكتب NOVA IDs للأعضاء مفصولة بفواصل (اختياري)");
 const memberIds=[];
 if(membersText?.trim()){
  const codes=membersText.split(",").map(x=>x.trim()).filter(Boolean);
  for(const code of codes){
   const {data:p}=await db.from("profiles").select("id").or(`nova_id.eq.${code},user_code.eq.${code},username.eq.${code}`).maybeSingle();
   if(p)memberIds.push(p.id);
  }
 }
 const {data:conversationId,error}=await db.rpc("nova_create_conversation",{
  p_type:"group",p_title:title.trim(),p_member_ids:memberIds
 });
 if(error)return toast(error.message);
 await loadConversations();openConversation(conversationId);toast("تم إنشاء المجموعة");
}
async function addGroupMembers(){
 const input=prompt("اكتب NOVA IDs للأعضاء الجدد مفصولة بفواصل");
 if(!input)return;
 const ids=[];
 for(const code of input.split(",").map(x=>x.trim()).filter(Boolean)){
  const {data:p}=await db.from("profiles").select("id").or(`nova_id.eq.${code},user_code.eq.${code},username.eq.${code}`).maybeSingle();
  if(p)ids.push(p.id);
 }
 if(!ids.length)return toast("لم يتم العثور على أعضاء");
 const {data,error}=await db.rpc("nova_add_conversation_members",{p_conversation_id:currentConversation.id,p_member_ids:ids});
 if(error)return toast(error.message);
 toast(`تمت إضافة ${data} عضو`);conversationInfo();
}

function subscribeRealtime(){
 if(activeChannel)db.removeChannel(activeChannel);
 activeChannel=db.channel("nova-user-"+currentUser.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"messages"},payload=>{
  const m=payload.new;if(!m||m.sender_id===currentUser.id)return;
  if(currentConversation?.id===m.conversation_id){messageCache.push(m);renderMessages();}
  loadConversations();
 })
 .on("postgres_changes",{event:"*",schema:"public",table:"friendships"},()=>loadFriends())
 .on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:`user_id=eq.${currentUser.id}`},()=>toast("لديك إشعار جديد"))
 .subscribe();
}
let conversationChannel=null;
function subscribeConversation(id){
 if(conversationChannel)db.removeChannel(conversationChannel);
 conversationChannel=db.channel("nova-conversation-"+id)
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${id}`},payload=>{
  const m=payload.new;if(m.sender_id===currentUser.id)return;
  if(!messageCache.some(x=>x.id===m.id)){messageCache.push(m);renderMessages();}
 })
 .subscribe();
}

/* ================== تشغيل الجلسة ================== */
db.auth.getSession().then(async({data,error})=>{
 if(error){showAuth();return;}
 if(data.session){
  currentUser=data.session.user;
  try{await ensureProfile();await boot();}catch(e){toast(e.message);showAuth();}
 }else showAuth();
});
db.auth.onAuthStateChange(async(event,session)=>{
 if(event==="SIGNED_OUT"){showAuth();return;}
 if(event==="SIGNED_IN"&&session&&!currentUser){
  currentUser=session.user;
  try{await ensureProfile();await boot();}catch(e){toast(e.message);}
 }
});
</script>
